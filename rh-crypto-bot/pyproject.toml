[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rh-crypto-bot"
version = "0.0.1"
description = "Autonomous Robinhood crypto trading bot (trend-following + LLM risk governor)"
requires-python = ">=3.9"
readme = "README.md"

[tool.setuptools.packages.find]
include = ["botcore*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py39"
line-length = 100
