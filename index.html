<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>bot monitor</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%93%9F%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<script src="config.js"></script>
<style>
  :root{
    --ground:#f3f6f4; --panel:#fff; --panel-2:#e9eeeb; --ink:#14201e;
    --ink-dim:#5a6b67; --line:#d9e0dc; --accent:#0e8d84; --good:#1c8757;
    --warn:#b0761c; --bad:#c0483f;
    --shadow:0 1px 2px rgba(18,38,35,.05),0 10px 28px rgba(18,38,35,.05); --r:14px;
  }
  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]){
      --ground:#0c1316; --panel:#131c20; --panel-2:#1a252a; --ink:#e0e8e7;
      --ink-dim:#899a9b; --line:#25333a; --accent:#49bdb1; --good:#57bb8c;
      --warn:#daa250; --bad:#d96b61;
      --shadow:0 1px 2px rgba(0,0,0,.32),0 12px 34px rgba(0,0,0,.30);
    }
  }
  :root[data-theme="dark"]{
    --ground:#0c1316; --panel:#131c20; --panel-2:#1a252a; --ink:#e0e8e7;
    --ink-dim:#899a9b; --line:#25333a; --accent:#49bdb1; --good:#57bb8c;
    --warn:#daa250; --bad:#d96b61;
    --shadow:0 1px 2px rgba(0,0,0,.32),0 12px 34px rgba(0,0,0,.30);
  }
  *{box-sizing:border-box}
  [hidden]{display:none!important}
  html,body{margin:0}
  body{
    background:var(--ground); color:var(--ink);
    font-family:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    line-height:1.5; -webkit-font-smoothing:antialiased;
  }
  .mono{font-family:"IBM Plex Mono",ui-monospace,Menlo,monospace;font-variant-numeric:tabular-nums}
  .wrap{max-width:900px;margin:0 auto;padding:22px 16px 48px}
  h1{margin:0;font-size:18px;font-weight:600;letter-spacing:-.01em}
  h2{margin:0;font-size:15px;font-weight:600}

  /* pin gate */
  #gate{position:fixed;inset:0;background:var(--ground);display:flex;align-items:center;
    justify-content:center;z-index:50;padding:20px}
  #gate form{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);
    box-shadow:var(--shadow);padding:26px 24px;width:100%;max-width:320px;text-align:center}
  #gate p{margin:0 0 14px;color:var(--ink-dim);font-size:13px}
  #gate input{width:100%;font-family:"IBM Plex Mono",monospace;font-size:22px;text-align:center;
    letter-spacing:.4em;padding:10px;border-radius:9px;border:1px solid var(--line);
    background:var(--panel-2);color:var(--ink)}
  #gate button{margin-top:12px;width:100%;font:600 14px/1 "IBM Plex Sans",sans-serif;padding:11px;
    border-radius:9px;border:1px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer}
  #gate .err{color:var(--bad);font-size:12px;margin-top:10px;min-height:14px}

  header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:6px}
  .dot{width:9px;height:9px;border-radius:50%;background:var(--good);flex:none;
    box-shadow:0 0 0 4px color-mix(in srgb,var(--good) 22%,transparent)}
  .dot.stale{background:var(--warn);box-shadow:0 0 0 4px color-mix(in srgb,var(--warn) 22%,transparent)}
  .dot.down{background:var(--bad);box-shadow:0 0 0 4px color-mix(in srgb,var(--bad) 22%,transparent)}
  @media (prefers-reduced-motion:no-preference){.dot{animation:pulse 2.6s ease-in-out infinite}}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.45}}
  .asof{font-family:"IBM Plex Mono",monospace;font-size:11.5px;color:var(--ink-dim)}
  .asof .warn{color:var(--warn);font-weight:600}

  .bots{display:grid;grid-template-columns:1fr;gap:16px;margin-top:14px}
  @media (min-width:760px){.bots{grid-template-columns:1fr 1fr}}
  .bot{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);
    box-shadow:var(--shadow);padding:16px;display:flex;flex-direction:column;gap:12px}
  .bot-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
  .bot-head .sub{font-size:11.5px;color:var(--ink-dim);font-family:"IBM Plex Mono",monospace}
  .badge{font-family:"IBM Plex Mono",monospace;font-size:10px;font-weight:600;letter-spacing:.08em;
    padding:3px 6px;border-radius:5px;border:1px solid var(--line);color:var(--ink-dim);white-space:nowrap}
  .badge.ok{color:var(--good);border-color:color-mix(in srgb,var(--good) 40%,var(--line))}
  .badge.warn{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 45%,var(--line))}
  .badge.bad{color:#fff;background:var(--bad);border-color:var(--bad)}

  .eq{font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums;
    font-size:30px;font-weight:600;letter-spacing:-.02em;line-height:1.1}
  .eq-sub{font-size:12.5px;color:var(--ink-dim);font-family:"IBM Plex Mono",monospace}
  .up{color:var(--good)} .down{color:var(--bad)}

  .mini{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
  .mini div{background:var(--panel-2);border:1px solid var(--line);border-radius:9px;padding:8px 9px}
  .mini .k{font-size:9.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-dim)}
  .mini .v{font-family:"IBM Plex Mono",monospace;font-size:15px;font-weight:600;margin-top:2px}

  .sec-h{font-size:10.5px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;
    color:var(--ink-dim);margin:2px 0 -2px}
  table{width:100%;border-collapse:collapse;font-family:"IBM Plex Mono",monospace;font-size:11.5px}
  th{text-align:right;font-weight:600;color:var(--ink-dim);font-size:9.5px;letter-spacing:.04em;
    padding:3px 4px;border-bottom:1px solid var(--line)}
  th:first-child{text-align:left}
  td{text-align:right;padding:4px 4px;border-bottom:1px solid var(--line)}
  td:first-child{text-align:left;color:var(--ink)}
  .tbl-wrap{overflow-x:auto}
  .flat{font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--ink-dim);padding:2px 0}

  ul.ev{list-style:none;margin:0;padding:0}
  ul.ev li{display:grid;grid-template-columns:42px 66px 1fr;gap:7px;align-items:baseline;
    padding:4px 0;border-top:1px solid var(--line);font-size:11px;font-family:"IBM Plex Mono",monospace}
  ul.ev li:first-child{border-top:none}
  ul.ev .t{color:var(--ink-dim);font-size:10px}
  ul.ev .kd{color:var(--ink-dim);font-size:9.5px;text-transform:uppercase}
  ul.ev li.warn .kd,ul.ev li.warn .m{color:var(--warn)}
  ul.ev li.err .kd,ul.ev li.err .m{color:var(--bad)}

  footer{margin-top:22px;text-align:center;font-size:11px;color:var(--ink-dim);line-height:1.7}
  #err{margin-top:14px;text-align:center;color:var(--bad);font-size:12px;font-family:"IBM Plex Mono",monospace}
</style>
</head>
<body>

<div id="gate" hidden>
  <form id="gateForm">
    <p>Enter PIN</p>
    <input id="pin" type="tel" inputmode="numeric" autocomplete="off" maxlength="8" aria-label="PIN">
    <button type="submit">Unlock</button>
    <div class="err" id="pinErr"></div>
  </form>
</div>

<div class="wrap" id="app" hidden>
  <header class="top">
    <div style="display:flex;align-items:center;gap:9px">
      <span class="dot" id="dot"></span>
      <h1>bot monitor</h1>
    </div>
    <span class="asof mono" id="asof">loading…</span>
  </header>
  <div class="bots" id="bots"></div>
  <div id="err" hidden></div>
  <footer>
    Private paper-trading bots — simulated money, no live orders.<br>
    Auto-refreshes every 20s · data pushed from the Mac every ~2&nbsp;min.
  </footer>
</div>

<script>
(function(){
  "use strict";

  // ---- config (filled at deploy) ----
  var DATA_URL = window.__DATA_URL__ || "status.json";
  var PIN = "1943";
  var POLL_MS = 20000;

  var $ = function(id){ return document.getElementById(id); };
  var MID = "·", DASH = "—", MINUS = "−";

  // ---- pin gate ----
  function unlocked(){ try{ return sessionStorage.getItem("mon_ok") === "1"; }catch(e){ return false; } }
  function showApp(){ $("gate").hidden = true; $("app").hidden = false; start(); }
  if(unlocked()){ showApp(); }
  else{
    $("gate").hidden = false;
    $("pin").focus();
    $("gateForm").addEventListener("submit", function(e){
      e.preventDefault();
      if($("pin").value.trim() === PIN){
        try{ sessionStorage.setItem("mon_ok","1"); }catch(e){}
        showApp();
      } else {
        $("pinErr").textContent = "Wrong PIN";
        $("pin").value = ""; $("pin").focus();
      }
    });
  }

  // ---- formatting ----
  function usd0(n){ return "$" + Math.round(n).toLocaleString("en-US"); }
  function usd(n){
    n = Number(n);
    var d = Math.abs(n) < 1 ? 6 : 2;
    return "$" + n.toLocaleString("en-US",{minimumFractionDigits:d,maximumFractionDigits:d});
  }
  function pct(n){ var s = n>0?"+":(n<0?MINUS:""); return s + Math.abs(n).toFixed(2) + "%"; }
  function money(n){ var a=Math.abs(n),s=n>0?"+$":(n<0?MINUS+"$":"$"); return s+(a>=100?Math.round(a).toLocaleString("en-US"):a.toFixed(2)); }
  function pad(n){ return (n<10?"0":"")+n; }
  function hm(ts){ var d=new Date(ts*1000); return pad(d.getHours())+":"+pad(d.getMinutes()); }
  function esc(s){ return String(s).replace(/[&<>]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;"}[c];}); }
  function stamp(ts){
    var d=new Date(ts*1000), mon=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"][d.getMonth()];
    var h=d.getHours(),ap=h>=12?"PM":"AM",h12=(h%12)||12;
    return mon+" "+d.getDate()+", "+h12+":"+pad(d.getMinutes())+" "+ap;
  }

  function botCard(b){
    var eq = b.equity || {}, dNow = (eq.now||0) - (eq.start||0);
    var p = eq.return_pct != null ? eq.return_pct : (eq.start ? dNow/eq.start*100 : 0);
    var cls = dNow>0.5?"up":dNow<-0.5?"down":"";
    var st = "OK", stc = "ok";
    if(b.halted || b.dead){ st = b.dead?"DEAD":"HALTED"; stc="bad"; }
    else if(b.paused){ st="PAUSED"; stc="warn"; }
    else if(b.protective_state && b.protective_state!=="OK"){ st=b.protective_state.toUpperCase(); stc="warn"; }

    var pos = b.positions || [];
    var posHtml = pos.length
      ? '<div class="tbl-wrap"><table><thead><tr><th>pos</th><th>qty</th><th>entry</th><th>now</th><th>P&amp;L</th></tr></thead><tbody>'
        + pos.map(function(x){
            var u = x.unrealized_pct != null ? x.unrealized_pct : 0;
            var c = u>0.02?"up":u<-0.02?"down":"";
            return '<tr><td>'+esc(x.ticker)+'</td><td>'+(+x.shares).toLocaleString("en-US",{maximumFractionDigits:4})
              +'</td><td>'+usd(x.entry_price)+'</td><td>'+usd(x.current_price)
              +'</td><td class="'+c+'">'+pct(u)+'</td></tr>';
          }).join("")
        + '</tbody></table></div>'
      : '<p class="flat">Flat '+DASH+' no open positions.</p>';

    var tr = b.closed_trades || [];
    var trHtml = tr.length
      ? '<div class="tbl-wrap"><table><thead><tr><th>closed</th><th>in</th><th>out</th><th>P&amp;L</th></tr></thead><tbody>'
        + tr.slice(0,6).map(function(x){
            var c = x.pnl>0?"up":x.pnl<0?"down":"";
            return '<tr><td>'+esc(x.symbol||x.ticker)+'</td><td>'+usd(x.entry_price)+'</td><td>'+usd(x.exit_price)
              +'</td><td class="'+c+'">'+money(x.pnl)+'</td></tr>';
          }).join("")
        + '</tbody></table></div>'
      : '<p class="flat">No closed trades yet.</p>';

    var ev = (b.events||[]).slice(0,7).map(function(e){
      var lc = e.level==="error"?"err":e.level==="warn"?"warn":"";
      return '<li class="'+lc+'"><span class="t">'+hm(e.ts)+'</span><span class="kd">'+esc(e.kind)
        +'</span><span class="m">'+esc(e.message)+'</span></li>';
    }).join("");

    return '<div class="bot">'
      + '<div class="bot-head"><div><h2>'+esc(b.name)+'</h2>'
        + '<div class="sub">'+esc(b.universe||"")+' '+MID+' '+esc(b.family||"")+' '+MID+' :'+ (b.dashboard_port||"") +'</div></div>'
        + '<span class="badge '+stc+'">'+st+'</span></div>'
      + '<div><div class="eq">'+usd0(eq.now||0)+'</div>'
        + '<div class="eq-sub '+cls+'">'+(dNow===0?"flat":money(dNow)+"  ("+pct(p)+")")+' vs '+usd0(eq.start||0)+'</div></div>'
      + '<div class="mini">'
        + '<div><div class="k">Open</div><div class="v">'+pos.length+'</div></div>'
        + '<div><div class="k">Closed</div><div class="v">'+tr.length+'</div></div>'
        + '<div><div class="k">Return</div><div class="v '+cls+'">'+pct(p)+'</div></div>'
      + '</div>'
      + '<div class="sec-h">Positions</div>'+posHtml
      + '<div class="sec-h">Closed trades</div>'+trHtml
      + '<div class="sec-h">Recent activity</div><ul class="ev">'+(ev||'<li><span></span><span></span><span class="m">'+DASH+'</span></li>')+'</ul>'
      + '</div>';
  }

  function render(data){
    var gen = data.generated_at || 0;
    var ageMin = (Date.now()/1000 - gen)/60;
    $("bots").innerHTML = (data.bots||[]).map(botCard).join("");
    var d = $("dot");
    d.className = "dot" + (ageMin>8 ? " stale" : "");
    $("asof").innerHTML = "updated " + esc(stamp(gen))
      + (ageMin>8 ? ' <span class="warn">'+MID+' '+Math.round(ageMin)+' min old</span>' : '');
    $("err").hidden = true;
  }

  function fail(msg){
    var e = $("err"); e.hidden = false; e.textContent = msg;
    $("dot").className = "dot down";
  }

  function tick(){
    fetch(DATA_URL + (DATA_URL.indexOf("?")<0?"?":"&") + "t=" + Date.now(), {cache:"no-store"})
      .then(function(r){ if(!r.ok) throw new Error("HTTP "+r.status); return r.json(); })
      .then(render)
      .catch(function(err){ fail("couldn't load status ("+err.message+") — retrying"); });
  }

  function start(){ tick(); setInterval(tick, POLL_MS); }
})();
</script>
</body>
</html>
